name: Build oaf.ko for ophub 6.18.64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bison flex libssl-dev libelf-dev bc wget tar gzip
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "KERNEL_ARCH=arm64" >> $GITHUB_ENV
          echo "KDIR=$GITHUB_WORKSPACE/kernel-src" >> $GITHUB_ENV

      - name: Download ophub kernel 6.18.64
        run: |
          wget -O kernel.tar.gz https://github.com/ophub/kernel/releases/download/kernel_stable/6.18.64.tar.gz
          mkdir -p kernel-src
          tar -xzf kernel.tar.gz -C kernel-src
          echo "===== 解压后一级目录 ====="
          ls -la kernel-src

      - name: Prepare kernel build environment
        run: |
          # 直接定位含顶层 Makefile 和 include/linux 的真正内核根
          KDIR=$(find kernel-src -type f -name Makefile -path "*6.18.64*" \
            -exec dirname {} \; | while read d; do
              if [ -d "$d/include/linux" ] && grep -q "^VERSION" "$d/Makefile"; then
                echo "$d"; break
              fi
            done)
          if [ -z "$KDIR" ]; then
            echo "未找到内核根目录，目录结构如下："
            find kernel-src -maxdepth 3 | head -80
            exit 1
          fi
          echo "真正的内核目录: $KDIR"
          echo "KDIR=$GITHUB_WORKSPACE/$KDIR" >> $GITHUB_ENV

          cd "$GITHUB_WORKSPACE/$KDIR"
          echo "===== 内核根目录内容 ====="
          ls -la | head -25

          # 没有 .config 时用 arm64 默认配置
          if [ ! -f .config ]; then
            make ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE defconfig
          fi
          make ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE olddefconfig
          make ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE modules_prepare

      - name: Clone OpenAppFilter
        run: |
          git clone --depth 1 https://github.com/destan19/OpenAppFilter.git oaf-src || \
          git clone --depth 1 https://gitee.com/listenerln/OpenAppFilter.git oaf-src

      - name: Locate OAF module source
        run: |
          OAF_DIR=$(dirname $(find oaf-src -name "app_filter.c" | head -1))
          if [ -z "$OAF_DIR" ] || [ "$OAF_DIR" = "." ]; then
            OAF_DIR=$(find oaf-src -maxdepth 3 -name "Makefile" -exec dirname {} \; | head -1)
          fi
          echo "OAF模块目录: $OAF_DIR"
          echo "OAF_DIR=$GITHUB_WORKSPACE/$OAF_DIR" >> $GITHUB_ENV

      - name: Build oaf.ko
        run: |
          cd $OAF_DIR
          make -C $KDIR M=$(pwd) ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE modules 2>&1 | tee build.log || true
          echo "===== 编译结果 ====="
          find . -name "*.ko" -exec ls -lh {} \;
          if [ ! -f oaf.ko ]; then
            echo "未生成 oaf.ko，请查看 build.log 末尾报错"
            tail -50 build.log
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oaf-ko-6.18.64-ophub
          path: |
            ${{ env.OAF_DIR }}/oaf.ko
            ${{ env.OAF_DIR }}/build.log
          if-no-files-found: warn
